<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="200" height="240">
  <defs>
    <mask id="nfl-mask">
      <rect width="100" height="120" fill="black"/>
      
      <!-- Shield outline -->
      <path d="M50 2 C50 2, 10 2, 5 10 C0 18, 2 30, 2 40 L2 75 C2 90, 20 105, 50 118 C80 105, 98 90, 98 75 L98 40 C98 30, 100 18, 95 10 C90 2, 50 2, 50 2Z" fill="white"/>
      
      <!-- Inner cutout for the blue area inside shield -->
      <path d="M50 8 C50 8, 14 8, 10 14 C6 20, 7 30, 7 38 L7 72 C7 85, 23 99, 50 112 C77 99, 93 85, 93 72 L93 38 C93 30, 94 20, 90 14 C86 8, 50 8, 50 8Z" fill="black"/>
      
      <!-- Football shape (white, visible) -->
      <ellipse cx="50" cy="38" rx="11" ry="7" fill="white" transform="rotate(-30 50 38)"/>
      
      <!-- Football laces (cutout) -->
      <line x1="44" y1="33" x2="56" y2="43" stroke="black" stroke-width="1.2"/>
      <line x1="45" y1="37" x2="48" y2="35" stroke="black" stroke-width="0.8"/>
      <line x1="48" y1="39" x2="51" y2="37" stroke="black" stroke-width="0.8"/>
      <line x1="51" y1="41" x2="54" y2="39" stroke="black" stroke-width="0.8"/>
      
      <!-- Stars (small white stars around football) -->
      <!-- Left stars -->
      <circle cx="22" cy="32" r="2.5" fill="white"/>
      <circle cx="22" cy="42" r="2.5" fill="white"/>
      <circle cx="22" cy="52" r="2.5" fill="white"/>
      <circle cx="30" cy="27" r="2.5" fill="white"/>
      <!-- Right stars -->
      <circle cx="78" cy="32" r="2.5" fill="white"/>
      <circle cx="78" cy="42" r="2.5" fill="white"/>
      <circle cx="78" cy="52" r="2.5" fill="white"/>
      <circle cx="70" cy="27" r="2.5" fill="white"/>
      
      <!-- White bar across bottom half for "NFL" text area -->
      <rect x="12" y="58" width="76" height="35" rx="2" fill="white"/>
      
      <!-- NFL text as cutout -->
      <text x="50" y="84" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="30" text-anchor="middle" fill="black">NFL</text>
    </mask>
  </defs>
  
  <rect width="100" height="120" fill="white" mask="url(#nfl-mask)"/>
</svg>